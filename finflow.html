}
function bindBudget() {
  const add = $('#bAdd');
  if (add) add.onclick = () => {
    const c = $('#bCat').value, v = +$('#bLimit').value;
    if (!c || !v) { toast('Укажите категорию и сумму'); return; }
    S.budgets[c] = v; save(); render(); toast('Лимит добавлен');
  };
  const sg = $('#bSuggest');
  if (sg) sg.onclick = () => {
    const per = monthKeys().slice(-3);
    const m = {};
    S.tx.filter(t => isSpend(t) && per.includes(ym(t.date))).forEach(t => m[t.cat] = (m[t.cat] || 0) + txBase(t));
    Object.entries(m).forEach(([k, v]) => { const mean = v / per.length; if (mean >= 30) S.budgets[k] = Math.round(mean * 1.05 / 10) * 10; });
    save(); render(); toast('Лимиты рассчитаны по среднему за 3 месяца +5%');
  };
  $$('[data-budget]').forEach(b => b.onclick = () => {
    const c = b.getAttribute('data-budget');
    modal({ title: 'Лимит: ' + cat(c).name,
      body: `<div class="field"><label class="fl">Лимит в месяц</label><input type="number" id="blv" value="${S.budgets[c]}"></div>`,
      foot: `<button class="btn danger" id="blDel">Удалить лимит</button><div style="flex:1"></div><button class="btn ghost" data-x>Отмена</button><button class="btn primary" id="blSave">Сохранить</button>`,
      onMount(w) {
        $('#blSave', w).onclick = () => { S.budgets[c] = +$('#blv', w).value || 0; save(); closeModal(); render(); };
        $('#blDel', w).onclick = () => { delete S.budgets[c]; save(); closeModal(); render(); };
      } });
  });
}

/* ============================================================
   Цели
   ============================================================ */
function monthlyCapacity() {
  const per = monthly(S.tx).slice(-6);
  return avg(per.map(m => m.saved + m.invested)) || (savingsPlan() ? savingsPlan().free * .5 : 0);
}
function viewGoals() {
  const cap = monthlyCapacity();
  const totalNeed = sum(S.goals.map(g => Math.max(0, g.target - g.saved)));
  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:center">
      <div><div class="muted" style="font-size:12.5px; font-weight:600">Целей</div><b style="font-size:20px">${S.goals.length}</b></div>
      <div><div class="muted" style="font-size:12.5px; font-weight:600">Осталось накопить</div><b style="font-size:20px">${money(totalNeed)}</b></div>
      <div><div class="muted" style="font-size:12.5px; font-weight:600">Ваш текущий темп</div><b style="font-size:20px">${money(cap)}/мес</b></div>
      <div style="flex:1"></div>
      <button class="btn primary" id="gAdd">Новая цель</button>
    </div>
  </div>
  ${S.goals.length ? `<div class="grid g3">${S.goals.map(g => {
    const p = clamp(g.saved / (g.target || 1) * 100, 0, 100);
    const left = Math.max(0, g.target - g.saved);
    const months = cap > 0 ? Math.ceil(left / cap) : null;
    return `<div class="card">
      <div class="goal-top">
        ${ringChart(p, 62, 'var(--accent)')}
        <span class="goal-em">${g.icon || '🎯'}</span>
        <span style="flex:1; min-width:0">
          <b style="font-size:16px; display:block">${esc(g.name)}</b>
          <b style="font-size:22px; letter-spacing:-.03em; display:block; margin-top:2px">${money(g.saved)}</b>
          <span class="muted" style="font-weight:600; font-size:13px">из ${money(g.target)} · ${Math.round(p)}%</span>
        </span>
        <button class="btn sm ghost" data-goal="${g.id}">Изменить</button></div>
      <div class="bar" style="height:8px; margin-top:12px"><i style="width:${p}%; background:var(--accent)"></i></div>
      <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:13.5px; font-weight:600">
        <span class="muted">осталось ${money(left)}</span></div>
      <div class="hr"></div>
      <div style="font-size:13.5px; color:var(--ink-2)">${left === 0 ? 'Цель достигнута.' :
        months ? `При текущем темпе — примерно <b>${months} мес.</b> (до ${monthLabel(addMonths(ym(ymd(new Date())), months))})` : 'Укажите регулярные накопления, чтобы увидеть срок.'}</div>
      ${g.due ? `<div class="muted" style="font-size:12.5px; margin-top:4px">Желаемый срок: ${dateHuman(g.due)}${months ? ' · нужно ' + money(left / Math.max(1, monthsBetween(ymd(new Date()), g.due))) + '/мес' : ''}</div>` : ''}
    </div>`;
  }).join('')}</div>` : `<div class="card"><div class="empty"><h3>Целей пока нет</h3><p>Цель — это способ превратить свободные деньги в конкретный результат: машину, поездку или резерв.</p>
    <button class="btn primary" id="gAdd2" style="margin-top:12px">Создать первую цель</button></div></div>`}`;
}
function monthsBetween(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  return Math.max(1, (d2.getFullYear() - d1.getFullYear()) * 12 + d2.getMonth() - d1.getMonth());
}
function bindGoals() {
  const open = id => goalDialog(id);
  ['#gAdd', '#gAdd2'].forEach(s => { const b = $(s); if (b) b.onclick = () => open(null); });
  $$('[data-goal]').forEach(b => b.onclick = () => open(b.getAttribute('data-goal')));
}
function goalDialog(id) {
  const g = id ? S.goals.find(x => x.id === id) : { id: uid(), icon: '🎯', name: '', target: 0, saved: 0, due: '' };
  const icons = ['🎯', '🚗', '🏝', '🏠', '🛟', '🎓', '💻', '💍', '👶', '🚲'];
  modal({
    title: id ? 'Цель' : 'Новая цель',
    body: `<div class="field"><label class="fl">Значок</label>
        <div style="display:flex; gap:6px; flex-wrap:wrap">${icons.map(i => `<button class="chip ${g.icon === i ? 'on' : ''}" data-ico="${i}" style="font-size:17px">${i}</button>`).join('')}</div></div>
      <div class="field"><label class="fl">Название</label><input type="text" id="gName" value="${esc(g.name)}" placeholder="например: Автомобиль"></div>
      <div class="grid g3">

        <div class="field"><label class="fl">Уже накоплено</label><input type="number" id="gSaved" value="${g.saved || ''}"></div>
        <div class="field"><label class="fl">Желаемый срок</label><input type="date" id="gDue" value="${g.due || ''}"></div>
      </div>`,
    foot: `${id ? '<button class="btn danger" id="gDel">Удалить</button>' : ''}<div style="flex:1"></div>
      <button class="btn ghost" data-x>Отмена</button><button class="btn primary" id="gSave">Сохранить</button>`,
    onMount(w) {
      let icon = g.icon;
      $$('[data-ico]', w).forEach(b => b.onclick = () => { icon = b.getAttribute('data-ico'); $$('[data-ico]', w).forEach(x => x.classList.remove('on')); b.classList.add('on'); });
      $('#gSave', w).onclick = () => {
        Object.assign(g, { icon, name: $('#gName', w).value.trim() || 'Цель', target: +$('#gTarget', w).value || 0, saved: +$('#gSaved', w).value || 0, due: $('#gDue', w).value });
        if (!id) S.goals.push(g);
        save(); closeModal(); render(); toast('Цель сохранена');
      };
      const d = $('#gDel', w); if (d) d.onclick = () => { S.goals = S.goals.filter(x => x.id !== id); save(); closeModal(); render(); };
    }
  });
}

      <p class="muted" style="font-size:12.5px; margin:8px 0 0">Простое сложение без учёта процентов и инфляции: показывает темп, а не гарантию.</p>

      <div class="bar" style="height:10px"><i style="width:${clamp(res.current / (res.target || 1) * 100, 0, 100)}%; background:${res.current >= res.target ? 'var(--pos)' : 'var(--accent)'}"></i></div>
      <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:13.5px; font-weight:600">

function bindSavings() {
  $$('[data-scen]').forEach(c => c.onclick = () => { VIEW.scenario = +c.getAttribute('data-scen'); render(); });

/* ============================================================
   Инвестиционный потенциал
   ============================================================ */
function viewInvest() {
  const p = savingsPlan(), res = reserveState();
  if (!p) return '<div class="card"><div class="empty"><h3>Нужны данные</h3><p>Загрузите операции, чтобы увидеть расчёт.</p></div></div>';
  const reserveReady = res && res.current >= res.target;
  const lo = Math.round(Math.max(0, p.free * .45) / 10) * 10, hi = Math.round(Math.max(0, p.free * .65) / 10) * 10;
  const rate = VIEW.rate != null ? VIEW.rate : (S.settings.currency === 'RUB' ? 12 : 5);
  const years = 10, monthlyAmt = VIEW.invAmt != null ? VIEW.invAmt : hi;
  const series = [], contrib = [];
  let bal = 0, put = 0;
  for (let y = 1; y <= years; y++) {
    for (let m = 0; m < 12; m++) { bal = bal * (1 + rate / 100 / 12) + monthlyAmt; put += monthlyAmt; }
    series.push(round2(bal)); contrib.push(round2(put));
  }
  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h3>Сколько потенциально остаётся для долгосрочных вложений</h3></div>
    <div class="stat-row" style="margin-bottom:14px">
      <div class="stat"><div class="lbl">Средний доход</div><div class="val" style="color:var(--pos)">${money(p.income)}</div></div>
      <div class="stat"><div class="lbl">Средние расходы</div><div class="val">${money(p.mandatory + p.optional)}</div></div>
      <div class="stat"><div class="lbl">Свободный остаток</div><div class="val">${money(p.free)}</div></div>
      <div class="stat"><div class="lbl">Уже инвестируется</div><div class="val">${money(p.invested)}</div></div>
    </div>
    <div class="card" style="background:var(--paper-2); border-style:dashed">
      <b style="font-size:15px">${reserveReady ? 'Резерв сформирован' : 'Сначала резерв, потом вложения'}</b>
      <p style="font-size:13.5px; color:var(--ink-2); margin:6px 0 0">
        ${reserveReady
          ? `Подушка на ${S.settings.reserveMonths} мес. уже собрана. По вашим данным на долгосрочные вложения потенциально доступно <b>${money(lo)}–${money(hi)}</b> в месяц.`
          : `Резерв закрыт на ${Math.round((res.current / (res.target || 1)) * 100)}% (${money(res.current)} из ${money(res.target)}). Обычно подушку формируют до начала долгосрочных вложений — иначе при непредвиденных тратах их приходится продавать в неудачный момент. После её закрытия потенциально доступно будет <b>${money(lo)}–${money(hi)}</b> в месяц.`}
      </p>
    </div>
    <p class="muted" style="font-size:12.5px; margin:12px 0 0">Это расчёт свободного остатка по вашим операциям, а не инвестиционная рекомендация. Приложение не советует конкретные инструменты и не обещает доходность.</p>
  </div>

  <div class="card">
    <div class="card-head"><h3>Сценарный калькулятор</h3><span class="sub">арифметика при заданных вами условиях</span></div>
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px">
      <div style="flex:1; min-width:170px"><label class="fl">Сумма в месяц</label><input type="number" id="invAmt" value="${monthlyAmt}"></div>
      <div style="flex:1; min-width:170px"><label class="fl">Условная годовая доходность: ${rate}%</label>
        <input type="range" id="invRate" min="0" max="${S.settings.currency === 'RUB' ? 25 : 12}" step="0.5" value="${rate}" style="width:100%; padding:0"></div>
    </div>
    ${lineChart({ height: 230, labels: Array.from({ length: years }, (_, i) => (i + 1) + ' г.'), series: [
      { name: 'Внесено', color: 'var(--muted)', values: contrib, dash: true },
      { name: 'При ставке ' + rate + '%', color: 'var(--pos)', values: series, area: true }] })}
    <div class="grid g3" style="margin-top:14px">
      <div><div class="muted" style="font-size:12.5px; font-weight:600">Внесено за 10 лет</div><b style="font-size:19px">${money(contrib[years - 1])}</b></div>
      <div><div class="muted" style="font-size:12.5px; font-weight:600">Итог при ${rate}% годовых</div><b style="font-size:19px">${money(series[years - 1])}</b></div>
      <div><div class="muted" style="font-size:12.5px; font-weight:600">Разница</div><b style="font-size:19px; color:var(--pos)">${money(series[years - 1] - contrib[years - 1])}</b></div>
    </div>
    <p class="muted" style="font-size:12.5px; margin:14px 0 0">Ставка — ваше предположение, а не прогноз. Реальная доходность меняется год к году и может быть отрицательной; расчёт не учитывает налоги, комиссии и инфляцию.</p>
  </div>`;
}
function bindInvest() {
  const a = $('#invAmt'), r = $('#invRate');
  if (a) a.onchange = () => { VIEW.invAmt = Math.max(0, +a.value || 0); render(); };
  if (r) r.oninput = () => { VIEW.rate = +r.value; render(); };
}

/* ============================================================
   Подписки и регулярные платежи

  const unused = subs.filter(r => S.subs[r.key] === 'no');

  const row = r => `<tr>

        <span class="t"><b>${esc(r.name)}</b><small>${esc(subName(r.cat, r.sub))} · ${freq(r.freq)} · ${r.count} платежей</small></span></div></td>
      <td class="r amt">${money(r.amount, { dec: 2 })}</td>
      <td class="r num hide-sm">${money(r.perMonth * 12)}</td>

  return `
  <div class="stat-row" style="margin-bottom:16px">

    <div class="stat"><div class="lbl">Отмечено как ненужные</div><div class="val" style="color:${unused.length ? 'var(--pos)' : 'var(--ink)'}">${money(sum(unused.map(s => s.perMonth)))}/мес</div></div>
  </div>
  ${unused.length ? `<div class="card" style="margin-bottom:16px; border-color:var(--pos); background:var(--pos-soft)">
    <b>Вы отметили ${unused.length} ${unused.length === 1 ? 'сервис' : 'сервиса'} как ненужные</b>
    <p style="font-size:13.5px; margin:6px 0 0">Отказ от них освободил бы ${money(sum(unused.map(s => s.perMonth)))} в месяц — это ${money(sum(unused.map(s => s.perMonth)) * 12)} в год. Отмена обычно делается в личном кабинете сервиса.</p></div>` : ''}
  <div class="card pad0" style="margin-bottom:16px">

  if (m) { const n = clamp(+m[1], 1, 36); return { from: addMonths(last, -(n - 1)), to: last, label: 'последние ' + n + ' мес.' }; }

function bindAssistant() {
  const send = async (text) => {
    if (!text.trim()) return;
    CHAT.push({ role: 'u', text });
    const local = answerLocal(text);
    CHAT.push({ role: 'a', text: local });
    render();
    const chat = $('#chat'); if (chat) chat.scrollTop = chat.scrollHeight;
    if (S.settings.smartAI && S.tx.length) {
      const holder = $('#chat').lastElementChild;
      const extra = document.createElement('div');
      extra.className = 'msg a'; extra.innerHTML = '<span class="muted">Думаю…</span>';
      $('#chat').appendChild(extra);
      const res = await answerSmart(text, extra);
      if (res) { CHAT.push({ role: 'a', text: esc(res).replace(/\n/g, '<br>') }); }
      else extra.remove();
      render();
    }
  };
  $('#aiGo').onclick = () => { const v = $('#aiQ').value; $('#aiQ').value = ''; send(v); };
  $('#aiQ').onkeydown = e => { if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; send(v); } };
  $$('[data-q]').forEach(b => b.onclick = () => send(b.getAttribute('data-q')));
  $('#aiSmart').onchange = e => { S.settings.smartAI = e.target.checked; save(); };
}

    const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Файл подготовлен: <b>' + esc(filename) + '</b>');
    return true;
  } catch (e) {
    modal({ title: 'Скопируйте данные', body: `<p class="muted">Сохранение файлов в этом окне недоступно. Скопируйте содержимое вручную.</p>
      <textarea style="min-height:280px">${esc(typeof data === 'string' ? data : '')}</textarea>`, foot: '<button class="btn primary" data-x>Готово</button>' });
    return false;
  }
}
function exportDialog(list) {
  list = list || S.tx;
  modal({
    title: 'Экспорт данных',
    body: `<p class="muted" style="margin-top:0">Будет выгружено операций: <b>${list.length}</b>. Файл формируется в браузере, данные никуда не отправляются.</p>
      <div class="grid g3">
        <button class="btn" id="exCsv" style="flex-direction:column; height:96px">CSV<span class="muted" style="font-size:12px; font-weight:600">таблица для Excel и Google Sheets</span></button>
        <button class="btn" id="exXlsx" style="flex-direction:column; height:96px">Excel (XLSX)<span class="muted" style="font-size:12px; font-weight:600">операции + сводка по категориям</span></button>
        <button class="btn" id="exPdf" style="flex-direction:column; height:96px">Финансовый отчёт<span class="muted" style="font-size:12px; font-weight:600">печать или сохранение в PDF</span></button>
      </div>
      <div class="hr"></div>
      <button class="btn sm ghost" id="exJson">Выгрузить все данные приложения в JSON (резервная копия)</button>`,
    onMount(w) {
      $('#exCsv', w).onclick = () => { saveFile('operacii.csv', '\uFEFF' + toCSV(txToRows(list))); closeModal(); };
      $('#exXlsx', w).onclick = () => {
        if (typeof XLSX === 'undefined') { toast('Библиотека Excel недоступна — используйте CSV'); return; }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txToRows(list)), 'Операции');
        const cats = byCategory(list);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Категория', 'Сумма', 'Операций', 'Доля %']]
          .concat(cats.map(c => [cat(c.cat).name, c.total, c.count, Math.round(c.total / (sum(cats.map(x => x.total)) || 1) * 100)]))), 'Категории');
        const per = monthly(list);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Месяц', 'Доходы', 'Расходы', 'Накопления', 'Инвестиции', 'Свободно']]
          .concat(per.map(m => [m.key, m.income, m.spend, m.saved, m.invested, m.free]))), 'По месяцам');
        const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        saveFile('finansy.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        closeModal();
      };
      $('#exPdf', w).onclick = () => { closeModal(); printReport(); };
      $('#exJson', w).onclick = () => { saveFile('ledger-backup.json', JSON.stringify(S, null, 2)); closeModal(); };
    }
  });
}
function printReport() {
  const ms = monthKeys(), last = ms[ms.length - 1];
  const list = S.tx.filter(t => ym(t.date) === last);
  const T = totals(list), cats = byCategory(list);
  const prev = ms[ms.length - 2];
  const old = $('#page').innerHTML;
  $('#page').innerHTML = `<div class="card" style="border:none">
    <h1 style="font-size:24px">Финансовый отчёт — ${esc(monthLabel(last))}</h1>
    <p class="muted" style="font-size:13px">Сформировано ${dateHuman(ymd(new Date()))} приложением Ledger по данным, сохранённым в браузере.</p>
    <div class="hr"></div>
    <table class="tbl" style="max-width:420px">
      <tr><td>Доходы</td><td class="r amt in">${money(T.income)}</td></tr>
      <tr><td>Расходы</td><td class="r amt">${money(T.spend)}</td></tr>
      <tr><td>Накопления</td><td class="r amt">${money(T.saved)}</td></tr>
      <tr><td>Инвестиции</td><td class="r amt">${money(T.invested)}</td></tr>
      <tr><td><b>Свободные деньги</b></td><td class="r amt"><b>${money(T.free)}</b></td></tr>
    </table>
    <h2 style="margin:22px 0 10px">Топ категорий</h2>
    <table class="tbl">${cats.map(c => {
      const b = prev ? sum(S.tx.filter(t => isSpend(t) && t.cat === c.cat && ym(t.date) === prev).map(txBase)) : null;
      const d = b ? (c.total - b) / b * 100 : null;
      return `<tr><td>${cat(c.cat).name}</td><td class="r num">${money(c.total)}</td>
        <td class="r muted">${c.count} оп.</td><td class="r">${d != null ? pct(d) + ' к прошлому месяцу' : ''}</td></tr>`;
    }).join('')}</table>
    <h2 style="margin:22px 0 10px">Регулярные платежи</h2>
    <table class="tbl">${recurring().slice(0, 12).map(r => `<tr><td>${esc(r.name)}</td><td class="r num">${money(r.amount, { dec: 2 })}</td><td class="r muted">${money(r.perMonth * 12)} в год</td></tr>`).join('')}</table>
    <p class="muted" style="font-size:12px; margin-top:24px">Отчёт носит информационный характер и не является финансовой рекомендацией.</p>
  </div>`;
  setTimeout(() => { window.print(); $('#page').innerHTML = old; render(); }, 60);
  toast('В окне печати выберите «Сохранить как PDF»');
}

/* ============================================================
   Настройки и «Ещё»
   ============================================================ */
function viewMore() {
  return `<div class="card pad0">${ROUTES.filter(r => !['dashboard', 'tx', 'analytics', 'goals'].includes(r.id)).map(r =>
    `<button data-go="${r.id}" style="display:flex; gap:12px; align-items:center; width:100%; padding:15px 18px; border-bottom:1px solid var(--line); font-weight:600; text-align:left">
      <span style="width:20px">${r.icon}</span>${r.name}</button>`).join('')}
    <button data-import style="display:flex; gap:12px; align-items:center; width:100%; padding:15px 18px; font-weight:600; text-align:left"><span style="width:20px">↥</span>Загрузить файл</button></div>`;
}
function viewSettings() {
  const rules = Object.entries(S.rules);
  return `
  <div class="grid g2">
    <div class="card">
      <div class="card-head"><h3>Основное</h3></div>
      <div class="field"><label class="fl">Основная валюта аналитики</label>
        <select id="setCur">${Object.keys(CUR).map(c => `<option ${S.settings.currency === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        <p class="muted" style="font-size:12.5px; margin:6px 0 0">Оригинальная сумма и валюта каждой операции сохраняются без изменений — пересчёт применяется только к аналитике.</p></div>
      <div class="field"><label class="fl">Тема</label>
        <div style="display:flex; gap:6px">
          ${['light', 'dark', 'auto'].map(t => `<button class="chip ${S.settings.theme === t ? 'on' : ''}" data-theme="${t}">${t === 'light' ? 'Светлая' : t === 'dark' ? 'Тёмная' : 'Как в системе'}</button>`).join('')}
        </div></div>
      <div class="field"><label class="fl">Размер финансовой подушки, месяцев</label>
        <input type="number" id="setRes" value="${S.settings.reserveMonths}" min="1" max="36"></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Ваши данные</h3></div>
      <p style="font-size:13.5px; margin:0 0 12px">Операции, правила и цели хранятся <b>только в этом браузере</b> (localStorage) и не отправляются на сервер. Разбор файлов тоже происходит на вашем устройстве.
      ${S.settings.smartAI ? ' Режим развёрнутых ответов передаёт помощнику <b>агрегированные</b> суммы по месяцам и категориям — без описаний операций.' : ''}</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn sm" id="setExport">Выгрузить данные</button>
        <button class="btn sm" data-import>Загрузить файл</button>
        ${S.settings.demo ? '<button class="btn sm" id="setDemoClear">Очистить демо-данные</button>' : '<button class="btn sm" data-demo>Загрузить демо-данные</button>'}
        <button class="btn sm danger" id="setWipe">Удалить все данные</button>
      </div>
      <div class="hr"></div>
      <div class="card-head"><h3 style="font-size:14px">История импортов</h3></div>
      ${S.imports.length ? `<table class="tbl" style="font-size:13.5px">${S.imports.map(i => `<tr>
        <td>${dateHuman(i.date)}<br><small class="muted">${esc(i.name)}</small></td>
        <td class="r">${i.count} оп.<br><small class="muted">${money(i.total)}</small></td>
        <td class="r"><button class="btn sm ghost" data-impview="${i.id}">Открыть</button></td></tr>`).join('')}</table>`
        : '<p class="muted" style="font-size:13.5px">Импортов пока не было.</p>'}
    </div>

    <div class="card">
      <div class="card-head"><h3>Правила категоризации</h3><span class="sub">${rules.length} шт.</span></div>
      <p class="muted" style="font-size:13px; margin:0 0 10px">Создаются автоматически, когда вы меняете категорию операции.</p>
      ${rules.length ? `<div style="max-height:260px; overflow:auto"><table class="tbl" style="font-size:13.5px">
        ${rules.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${esc(cat(v.cat).name)} → ${esc(subName(v.cat, v.sub))}</td>
        <td class="r"><button class="btn sm ghost" data-rule="${esc(k)}">×</button></td></tr>`).join('')}</table></div>` : ''}
    </div>

    <div class="card">
      <div class="card-head"><h3>Свои категории</h3></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end">
        <div style="flex:1; min-width:150px"><label class="fl">Название категории</label><input type="text" id="ccName" placeholder="например: Питомцы"></div>
        <div style="flex:1; min-width:150px"><label class="fl">Подкатегории через запятую</label><input type="text" id="ccSubs" placeholder="корм, ветеринар"></div>
        <button class="btn" id="ccAdd">Добавить</button>
      </div>
      ${Object.keys(S.customCats || {}).length ? `<div class="hr"></div>${Object.entries(S.customCats).map(([k, v]) =>
        `<div style="display:flex; align-items:center; gap:8px; padding:6px 0"><i class="dot" style="background:${v.color}"></i><b>${esc(v.name)}</b>
        <span class="muted" style="font-size:13px">${Object.values(v.subs).map(esc).join(', ')}</span>
        <div style="flex:1"></div><button class="btn sm ghost" data-delcat="${esc(k)}">Удалить</button></div>`).join('')}` : ''}
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="card-head"><h3>О расчётах</h3></div>
    <p style="font-size:13.5px; color:var(--ink-2); margin:0">Все показатели — включая индикатор финансового здоровья, сценарии накоплений и оценку свободных средств — рассчитываются по вашим операциям и носят информационный характер. Это не финансовая, налоговая или инвестиционная консультация и не гарантия результата. Проверяйте категории: от них зависят расчёты обязательных и необязательных расходов.</p>
  </div>`;
}
function bindSettings() {
  $('#setCur').onchange = e => { S.settings.currency = e.target.value; save(); render(); };
  $$('[data-theme]').forEach(b => b.onclick = () => {
    S.settings.theme = b.getAttribute('data-theme'); applyTheme(); save(); render();
  });
  $('#setRes').onchange = e => { S.settings.reserveMonths = clamp(+e.target.value || 6, 1, 36); save(); };
  $('#setExport').onclick = () => exportDialog(S.tx);
  const dc = $('#setDemoClear');
  if (dc) dc.onclick = () => {
    S.tx = S.tx.filter(t => t.src !== 'demo');
    S.imports = S.imports.filter(i => !i.demo);
    S.settings.demo = false; save(); render(); toast('Демо-данные удалены');
  };
  $('#setWipe').onclick = () => modal({
    title: 'Удалить все данные?',
    body: '<p>Будут удалены все операции, правила, бюджеты и цели из этого браузера. Действие необратимо — сначала можно выгрузить резервную копию.</p>',
    foot: '<button class="btn ghost" data-x>Отмена</button><button class="btn danger" id="wipeYes">Удалить всё</button>',
    onMount(w) { $('#wipeYes', w).onclick = () => { resetAll(); closeModal(); render(); toast('Данные удалены'); }; }
  });
  $$('[data-rule]').forEach(b => b.onclick = () => { delete S.rules[b.getAttribute('data-rule')]; save(); render(); });
  $('#ccAdd').onclick = () => {
    const name = $('#ccName').value.trim(), subs = $('#ccSubs').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!name) { toast('Укажите название'); return; }
    const id = 'c_' + uid();
    const palette = ['#E0876B', '#6FBF9E', '#8E96E0', '#D77FB0', '#C2A24B'];
    S.customCats[id] = { name, icon: '•', color: palette[Object.keys(S.customCats).length % palette.length],
      subs: (subs.length ? subs : ['Прочее']).reduce((a, s, i) => (a['s' + i] = s, a), {}) };
    save(); render(); toast('Категория добавлена');
  };
  $$('[data-delcat]').forEach(b => b.onclick = () => {
    const k = b.getAttribute('data-delcat');
    S.tx.forEach(t => { if (t.cat === k) { t.cat = 'other'; t.sub = 'unknown'; } });
    delete S.customCats[k]; save(); render();
  });
  $$('[data-impview]').forEach(b => b.onclick = () => {
    const imp = S.imports.find(i => i.id === b.getAttribute('data-impview'));
    modal({ title: 'Импорт ' + dateHuman(imp.date),
      body: `<p><b>${esc(imp.name)}</b></p><table class="tbl">
        <tr><td>Операций добавлено</td><td class="r amt">${imp.count}</td></tr>
        <tr><td>Сумма расходов</td><td class="r amt">${money(imp.total)}</td></tr>
        ${imp.skipped ? `<tr><td>Пропущено дубликатов</td><td class="r amt">${imp.skipped}</td></tr>` : ''}</table>`,
      foot: '<button class="btn primary" data-x>Готово</button>' });
  });
}

/* ============================================================
   Онбординг и запуск
   ============================================================ */
const STEPS = [
  { t: 'Добро пожаловать', p: 'Ledger превращает выписку по счёту в понятную картину: сколько приходит, куда уходит и что с этим можно сделать. Данные остаются в вашем браузере.' },
  { t: 'Импортируйте расходы', p: 'Подойдёт CSV, Excel, TXT или текстовый PDF. Приложение само определит, где дата, сумма и описание — вручную настраивать столбцы не нужно.' },
  { t: 'Мы распределим операции по категориям', p: '«Пятёрочка» станет продуктами, «Лукойл АЗС» — топливом, «Яндекс Плюс» — подпиской. Если ошибёмся, поправьте категорию один раз: дальше приложение запомнит правило.' },
  { t: 'Посмотрим, куда уходят деньги', p: 'Графики по категориям и месяцам, поиск крупных трат, регулярные платежи, аномалии и сравнение периодов.' },
  { t: 'Составим финансовый план', p: 'Бюджет, цели, размер подушки и сценарии накоплений — с расчётом, сколько вы потенциально можете откладывать. Решение всегда остаётся за вами.' }
];
function onboarding(step) {
  step = step || 0;
  const s = STEPS[step], last = step === STEPS.length - 1;
  modal({
    title: s.t,
    body: `<div style="display:flex; gap:6px; margin-bottom:16px">${STEPS.map((_, i) => `<i style="height:3px; flex:1; border-radius:2px; background:${i <= step ? 'var(--accent)' : 'var(--line)'}"></i>`).join('')}</div>
      <p style="font-size:15px; color:var(--ink-2); margin:0">${esc(s.p)}</p>
      ${last ? `<div class="hr"></div><div style="display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn primary" id="obImport">Загрузить файл</button>
        <button class="btn" id="obDemo">Начать с демо-данных</button></div>` : ''}`,
    foot: last ? '' : `<button class="btn ghost" id="obSkip">Пропустить</button><button class="btn primary" id="obNext">Дальше</button>`,
    onMount(w) {
      const done = () => { S.settings.onboarded = true; save(); };
      if ($('#obNext', w)) $('#obNext', w).onclick = () => onboarding(step + 1);
      if ($('#obSkip', w)) $('#obSkip', w).onclick = () => { done(); closeModal(); render(); };
      if ($('#obImport', w)) $('#obImport', w).onclick = () => { done(); closeModal(); $('#filePick').click(); };
      if ($('#obDemo', w)) $('#obDemo', w).onclick = () => { done(); loadDemo(); closeModal(); go('dashboard'); toast('Демо-данные загружены: <b>' + S.tx.length + '</b> операций'); };
    }
  });
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function init() {
  const had = load();
  applyTheme();
  $('#filePick').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleFile(f); e.target.value = ''; });
  $('#railImport').onclick = () => $('#filePick').click();
  let dragTimer;
  ['dragover', 'dragenter'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    clearTimeout(dragTimer);
    document.body.classList.add('dragging');
  }));
  window.addEventListener('dragleave', () => { dragTimer = setTimeout(() => document.body.classList.remove('dragging'), 120); });
  window.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  render();
  if (!S.settings.onboarded && !had) onboarding(0);
}
init();

/* Установка как приложение: регистрируем service worker только там,
   где рядом лежит manifest.webmanifest (то есть в размещённой версии). */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  fetch('manifest.webmanifest', { method: 'GET' })
    .then(r => { if (r.ok) return navigator.serviceWorker.register('sw.js'); })
    .catch(() => {});
}

</script>
